[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidra-fleet"
version = "0.2.0"
description = "Headless multi-binary Ghidra analysis MCP server: one stdio server, many binaries, zero TCP ports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Reverse Engineering",
]
dependencies = [
    # tested against fastmcp 4.x only
    "fastmcp>=4.0",
]

# NOTE: pyghidra / jpype1 are intentionally NOT PyPI dependencies here.
# They must match the local Ghidra installation exactly and are installed
# from the wheels bundled with Ghidra itself:
#   <GHIDRA_INSTALL_DIR>/Ghidra/Features/PyGhidra/pypkg/dist/
# See scripts/setup_env.bat

[project.scripts]
ghidra-fleet = "ghidra_fleet.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "BLE"]
ignore = [
    # MCP tools deliberately catch broad exceptions and return error text:
    # a crashing tool would kill the whole AI workflow for one bad input.
    "BLE001",
    # user-facing messages are Chinese with full-width punctuation by design
    "RUF001",
    "RUF002",
    "RUF003",
    # test scripts run against unspecified system paths
    "S108",
]

[tool.ruff.lint.per-file-ignores]
# test scripts legitimately use asserts, prints, broad excepts, and must set
# env vars (GHIDRA_INSTALL_DIR) before importing the package under test
"tests/*" = ["S101", "BLE001", "T201", "E402"]
